appenders = ConsoleAppender, NumbersFileAppender

appender.ConsoleAppender.type = Console
appender.ConsoleAppender.name = ConsoleAppender
appender.ConsoleAppender.layout.type = PatternLayout
appender.ConsoleAppender.layout.pattern = %-d{yyyy-MM-dd HH:mm:ss} [ %p ] [ %c ] %m%n

appender.NumbersFileAppender.type = File
appender.NumbersFileAppender.name = NumbersFileAppender
appender.NumbersFileAppender.fileName=numbers.log
appender.NumbersFileAppender.layout.type=PatternLayout
appender.NumbersFileAppender.layout.pattern=%msg%n

rootLogger.level = INFO
rootLogger.appenderRefs = DEBUG
rootLogger.appenderRef.console.ref = ConsoleAppender

logger.NUMBERS.name = NUMBERS
logger.NUMBERS.level = INFO
logger.NUMBERS.appenderRef.logfile.ref=NumbersFileAppender

