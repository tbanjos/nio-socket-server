appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-d{yyyy-MM-dd HH:mm:ss} [ %p ] [ %c ] %m%n

appender.TestAppender.type = File
appender.TestAppender.name = TestAppender
appender.TestAppender.fileName=test_file.txt
appender.TestAppender.layout.type=PatternLayout
appender.TestAppender.layout.pattern=%msg%n

logger.TEST.name = TEST
logger.TEST.level = INFO
logger.TEST.appenderRef.logfile.ref=TestAppender

rootLogger.level = DEBUG, console, TestAppender
rootLogger.appenderRef.console.ref = console