appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-d{yyyy-MM-dd HH:mm:ss} [ %p ] [ %c ] %m%n

appender.NumbersFileAppender.type = File
appender.NumbersFileAppender.name = NumbersFileAppender
appender.NumbersFileAppender.fileName=test_file.txt
appender.NumbersFileAppender.layout.type=PatternLayout
appender.NumbersFileAppender.layout.pattern=%msg%n

logger.logfile.name = logfile
logger.logfile.level = INFO
logger.logfile.appenderRef.logfile.ref=NumbersFileAppender

rootLogger.level = DEBUG, console, NumbersFileAppender
rootLogger.appenderRef.console.ref = console